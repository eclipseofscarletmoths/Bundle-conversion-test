name: doctor-bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the queue release holding input.bundle"
        required: true
        type: string

      output_format:
        description: "Texture output format"
        required: false
        default: "RGBA32"
        type: choice
        options:
          - RGBA32
          - ETC2
          - ETC2_RGB
          - ETC2_RGBA8
          - ASTC_RGBA_4x4
          - ASTC_RGBA_6x6
          - ASTC_RGBA_8x8

# Least-privilege: this token can only touch this repo's releases/contents,
# not your account broadly. Still, treat the PAT the tweak uses to trigger
# this workflow as sensitive — see BundleDoctorService.m notes.
permissions:
  contents: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    # 20m wasn't a correctness bug - it was cutting off a legitimately slow
    # but working run mid-texture. TransplantTextures decodes BOTH sides of
    # every Texture2D pair fully to RGBA32, single-threaded, before it can
    # diff them (see TransplantMode.cs) - large ASTC_RGBA_6x6/DXT5Crunched
    # atlases (2048x2048) are the expensive ones, and each "not present in
    # original" texture also pays a subprocess spawn via Etc2Encoder. None of
    # that is parallelized yet, so give it real headroom rather than tuning
    # this number to one specific bundle's texture count.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # native/etcpak/build only depends on the vendored etcpak sources, not
      # on anything that changes per-run (input.bundle, output_format) - so
      # it's safe to cache keyed on those sources. dotnet build's
      # BuildVendoredEtcpakEncoder MSBuild target always invokes cmake, but a
      # cache hit here means that's just a fast incremental no-op (cmake/make
      # see nothing changed) instead of a cold compile of ProcessRGB.cpp.
      - name: Cache vendored etcpak build
        uses: actions/cache@v4
        with:
          path: BundleDoctor/native/etcpak/build
          key: etcpak-build-${{ runner.os }}-${{ hashFiles('BundleDoctor/native/etcpak/**') }}

      - name: Restore & build converter
        run: dotnet build BundleDoctor/BundleDoctor.csproj -c Release -o build

      - name: Fetch input.bundle from the queue release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "input.bundle" \
            --output input.bundle

      # original.bundle is now mandatory: BundleDoctor runs in `transplant`
      # mode (diff + selective Texture2D/Sprite transplant against the known-
      # good iOS bundle), and that mode has no meaningful fallback without an
      # original to diff/rebuild from - unlike the old shader-restore pass,
      # there's no degraded-but-safe path here. Fail the job outright rather
      # than silently falling back to the legacy full-reencode pipeline (see
      # doctor/BundleDoctorService.m - the client is confirmed to always
      # upload this file, so its absence means something upstream broke).
      - name: Fetch original.bundle from the queue release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "original.bundle" \
            --output original.bundle

      - name: Run BundleDoctor
        env:
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: |
          FORMAT="${OUTPUT_FORMAT:-RGBA32}"
          # transplant's positional order is <original> <modded> <output>:
          # original.bundle is the known-good iOS bundle we diff against and
          # rebuild from, input.bundle (desktop-authored, from the queue
          # release) is the modded side. --new-texture-format only governs
          # brand-new textures with no counterpart in original - everything
          # unchanged or re-encoded keeps original's own per-texture format.
          dotnet build/BundleDoctor.dll transplant original.bundle input.bundle output.bundle --new-texture-format "$FORMAT"

      - name: Upload output.bundle back onto the same release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" output.bundle \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Mark Done Signal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo done > done.marker
          gh release upload "${{ inputs.release_tag }}" done.marker \
            --repo "${{ github.repository }}" \
            --clobber
